<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Cowboy Espacial - Frontend</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:1rem;color:#222}
  h1{margin-bottom:.2rem} section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}
  table{border-collapse:collapse;width:100%} th,td{border-bottom:1px solid #ddd;padding:.35rem;text-align:left}
  input,select,button{padding:.4rem;margin:.15rem} button{cursor:pointer}
  #msg{padding:.5rem;border-radius:6px;display:none} .ok{background:#d9f5dd;display:block!important}
  .err{background:#fbdada;display:block!important} .row{display:flex;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<h1>El Cowboy Espacial</h1>
<div class="row">
  <label>URL de la API:</label>
  <input id="apiUrl" size="32">
  <button onclick="guardarUrl()">Guardar y recargar</button>
</div>
<div id="msg"></div>

<section>
  <h2>Productos</h2>
  <table id="tablaProductos"></table>
  <h3>Crear producto</h3>
  <div class="row">
    <select id="pTipo" onchange="actualizarCamposProducto()">
      <option value="normal">Normal</option><option value="electronico">Electrónico</option><option value="ropa">Ropa</option>
    </select>
    <input id="pNombre" placeholder="Nombre">
    <input id="pPrecio" type="number" step="0.01" placeholder="Precio">
    <input id="pStock" type="number" placeholder="Stock">
    <input id="pGarantia" type="number" placeholder="Meses garantía" style="display:none">
    <input id="pTalla" placeholder="Talla" style="display:none">
    <input id="pColor" placeholder="Color" style="display:none">
    <button onclick="crearProducto()">Crear</button>
  </div>
</section>

<section>
  <h2>Usuarios</h2>
  <table id="tablaUsuarios"></table>
  <h3>Crear usuario</h3>
  <div class="row">
    <select id="uTipo"><option value="cliente">Cliente</option><option value="administrador">Administrador</option></select>
    <input id="uNombre" placeholder="Nombre">
    <input id="uEmail" placeholder="Email">
    <input id="uDireccion" placeholder="Dirección (clientes)">
    <button onclick="crearUsuario()">Crear</button>
  </div>
</section>

<section>
  <h2>Pedidos</h2>
  <h3>Crear pedido</h3>
  <div class="row">
    <select id="pedCliente"></select>
    <select id="pedProducto"></select>
    <input id="pedCantidad" type="number" min="1" value="1" style="width:70px">
    <button onclick="anadirLinea()">Añadir línea</button>
  </div>
  <ul id="lineas"></ul>
  <button onclick="crearPedido()">Realizar pedido</button>
  <h3>Pedidos de un usuario</h3>
  <div class="row"><select id="consCliente"></select><button onclick="verPedidos()">Consultar</button></div>
  <div id="resultadoPedidos"></div>
</section>

<script>
// URL base de la API: se guarda en el navegador para poder cambiarla
// (localhost o la IP de otro equipo) sin tocar el codigo.
let API_URL = localStorage.getItem("apiUrl") || "http://localhost:8000";
document.getElementById("apiUrl").value = API_URL;
function guardarUrl(){
  localStorage.setItem("apiUrl", document.getElementById("apiUrl").value.trim().replace(/\/$/, ""));
  location.reload();
}

let productos = [], usuarios = [], lineasPedido = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function aviso(texto, ok){ const m=$("msg"); m.textContent=texto; m.className=ok?"ok":"err"; }

// ---- FUNCION CENTRAL DE PETICIONES HTTP ----
// Todas las llamadas a la API pasan por aqui: fetch(url, {method, headers, body}).
// Si el codigo de estado no es 2xx se lanza un error con el "detail" que devuelve FastAPI
// (en errores 422 de validacion, "detail" es una lista y se resume).
async function api(metodo, ruta, cuerpo){
  const opciones = {method: metodo, headers: {"Content-Type": "application/json"}};
  if (cuerpo !== undefined) opciones.body = JSON.stringify(cuerpo);
  const resp = await fetch(API_URL + ruta, opciones);
  const datos = await resp.json().catch(() => null);
  if (!resp.ok) {
    let detalle = datos && datos.detail;
    if (Array.isArray(detalle)) detalle = detalle.map(e => (e.loc||[]).slice(1).join(".") + ": " + e.msg).join(" | ");
    throw new Error(`${resp.status} - ${detalle || resp.statusText}`);
  }
  return datos;
}

// ---- PRODUCTOS ----
async function cargarProductos(){            // GET /productos
  productos = await api("GET", "/productos");
  $("tablaProductos").innerHTML = "<tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Stock</th><th>Extra</th><th></th></tr>" +
    productos.map(p => `<tr><td>${esc(p.nombre)}</td><td>${p.tipo}</td><td>${p.precio.toFixed(2)} €</td><td>${p.stock}</td>
      <td>${p.meses_garantia!=null ? p.meses_garantia+" meses garantía" : (p.talla ? "talla "+esc(p.talla)+", "+esc(p.color) : "")}</td>
      <td><button onclick="eliminarProducto('${p.id}')">Eliminar</button></td></tr>`).join("");
  $("pedProducto").innerHTML = productos.map(p => `<option value="${p.id}">${esc(p.nombre)} (stock ${p.stock})</option>`).join("");
}
function actualizarCamposProducto(){
  const t = $("pTipo").value;
  $("pGarantia").style.display = t==="electronico" ? "" : "none";
  $("pTalla").style.display = $("pColor").style.display = t==="ropa" ? "" : "none";
}
async function crearProducto(){              // POST /productos
  const tipo = $("pTipo").value;
  const cuerpo = {tipo, nombre: $("pNombre").value, precio: parseFloat($("pPrecio").value), stock: parseInt($("pStock").value)};
  if (tipo==="electronico") cuerpo.meses_garantia = parseInt($("pGarantia").value);
  if (tipo==="ropa") { cuerpo.talla = $("pTalla").value; cuerpo.color = $("pColor").value; }
  await accion(async () => { const p = await api("POST", "/productos", cuerpo); await cargarProductos(); return `Producto "${p.nombre}" creado`; });
}
async function eliminarProducto(id){         // DELETE /productos/{id}
  await accion(async () => { const r = await api("DELETE", "/productos/" + id); await cargarProductos(); return r.message; });
}

// ---- USUARIOS ----
async function cargarUsuarios(){             // GET /usuarios
  usuarios = await api("GET", "/usuarios");
  $("tablaUsuarios").innerHTML = "<tr><th>Nombre</th><th>Email</th><th>Rol</th></tr>" +
    usuarios.map(u => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.email)}</td><td>${u.es_admin?"Administrador":"Cliente"}</td></tr>`).join("");
  const opciones = usuarios.map(u => `<option value="${u.id}">${esc(u.nombre)}${u.es_admin?" (admin)":""}</option>`).join("");
  $("pedCliente").innerHTML = $("consCliente").innerHTML = opciones;
}
async function crearUsuario(){               // POST /usuarios
  const cuerpo = {tipo: $("uTipo").value, nombre: $("uNombre").value, email: $("uEmail").value};
  if ($("uDireccion").value) cuerpo.direccion = $("uDireccion").value;
  await accion(async () => { const u = await api("POST", "/usuarios", cuerpo); await cargarUsuarios(); return `Usuario "${u.nombre}" creado`; });
}

// ---- PEDIDOS ----
function anadirLinea(){
  const id = $("pedProducto").value, cantidad = parseInt($("pedCantidad").value);
  if (!id || !(cantidad > 0)) return aviso("Elige un producto y una cantidad válida", false);
  lineasPedido.push({producto_id: id, cantidad});
  pintarLineas();
}
function pintarLineas(){
  $("lineas").innerHTML = lineasPedido.map(l => {
    const p = productos.find(x => x.id === l.producto_id);
    return `<li>${l.cantidad} × ${esc(p ? p.nombre : l.producto_id)}</li>`;
  }).join("");
}
async function crearPedido(){                // POST /pedidos
  if (lineasPedido.length === 0) return aviso("Añade al menos una línea", false);
  const cuerpo = {cliente_id: $("pedCliente").value, items: lineasPedido};
  await accion(async () => {
    const p = await api("POST", "/pedidos", cuerpo);
    lineasPedido = []; pintarLineas(); await cargarProductos();   // el stock ha cambiado
    return `Pedido creado. Total: ${p.total.toFixed(2)} €`;
  });
}
async function verPedidos(){                 // GET /usuarios/{id}/pedidos
  await accion(async () => {
    const pedidos = await api("GET", `/usuarios/${$("consCliente").value}/pedidos`);
    $("resultadoPedidos").innerHTML = pedidos.length === 0 ? "<p>Sin pedidos.</p>" : pedidos.map(p =>
      `<p><b>${new Date(p.fecha).toLocaleString()}</b> - total ${p.total.toFixed(2)} €</p><ul>` +
      p.items.map(i => `<li>${i.cantidad} × ${esc(i.nombre)} = ${i.subtotal.toFixed(2)} €</li>`).join("") + "</ul>").join("");
    return `${pedidos.length} pedido(s) encontrado(s)`;
  });
}

// Ejecuta una accion y muestra el resultado (o el error HTTP) en el aviso superior
async function accion(fn){
  try { aviso(await fn(), true); } catch (e) { aviso("Error: " + e.message, false); }
}

// Carga inicial
accion(async () => { await cargarProductos(); await cargarUsuarios(); return "Conectado con la API en " + API_URL; });
</script>
</body>
</html>
